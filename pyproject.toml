[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sql-auto-repair-openenv"
version = "1.1.0"
description = "SQL Auto-Repair RL environment for the OpenEnv framework"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "httpx>=0.24.0",
    "openenv-core>=0.2.0",
    "requests>=2.28.0",
    # torch is installed separately in Dockerfile using the CPU-only wheel URL
    # to avoid pip pulling the ~2GB CUDA build from PyPI
]

[tool.hatch.build.targets.wheel]
packages = ["server", "baseline"]

[project.scripts]
server = "server.app:main"
